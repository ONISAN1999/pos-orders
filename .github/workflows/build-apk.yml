name: Build POS Orders APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (preinstalled on runner)
        run: |
          SDK=$ANDROID_HOME
          [ -z "$SDK" ] && SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SDKM=$(ls -d $SDK/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null 2>&1 || true
          $SDKM --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        run: base64 -d app/pos.keystore.b64 > app/pos.keystore

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk POSOrders.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pos-orders-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish release (direct APK link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: POS Orders build ${{ github.run_number }}
          files: POSOrders.apk

      - name: Commit APK to dist/ (for direct git download)
        run: |
          mkdir -p dist
          cp POSOrders.apk dist/POSOrders.apk
          VC=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          NOTES=$(python3 -c "import json,sys; t=open('dist/notes.txt',encoding='utf-8').read() if __import__('os').path.exists('dist/notes.txt') else ''; print(json.dumps(t.replace(chr(10),' ').strip()[:160], ensure_ascii=False)[1:-1])")
          printf '{"versionCode":%s,"versionName":"%s","build":%s,"apk":"https://raw.githubusercontent.com/ONISAN1999/pos-orders/main/dist/POSOrders.apk","notes":"%s","at":"%s"}\n' "$VC" "$VN" "${{ github.run_number }}" "$NOTES" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json
          cat dist/version.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/POSOrders.apk dist/version.json
          git commit -m "dist: POSOrders.apk build ${{ github.run_number }} [skip ci]" || exit 0
          git push
